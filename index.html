<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Detect &amp; Correct — ECG Lead Swap Demo</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <!--
    Static, self-contained prototype for the poster "Detect and Correct" flow.
    No server round-trips: all logic + (fake) case data live client-side so the
    page loads once and runs from cache on a phone/tablet/laptop.

    SKELETON NOTE: model outputs and ECG waveforms here are FAKE placeholders.
    Real work later replaces js/cases.js data with precomputed exports from
    ecg-lead-swapping/codes/website_export/ (see repo TODO.md).
  -->
  <div id="app" class="app"></div>

  <footer class="site-disclaimer">
    Prototype — uses <strong>simulated</strong> model outputs and synthetic ECGs.
    No personal data is collected. No ECG uploads.
  </footer>

  <script src="./js/ecg.js"></script>
  <script src="./js/bodyDiagram.js"></script>
  <script src="./js/cases.js"></script>
  <script src="./js/app.js"></script>
  <script>
    // Basic offline caching for unreliable conference Wi-Fi. Optional; ignore failures.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
